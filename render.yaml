services:
  - type: web
    name: ais42-healthoutreach
    env: python
    region: singapore
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "cd backend && gunicorn --bind 0.0.0.0:$PORT --workers 1 --timeout 120 app:app"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
